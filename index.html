<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Indian Jewellery Set | LevelUpGears</title>
<meta name="description" content="South Indian gold plated matte jewellery set with cubic zirconia stones. Adjustable size.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fa;--card:#fff;--ink:#12232e;--mute:#5d6f7a;--line:#dbe4e8;--brand:#0f766e;--pop:#ffd23f}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.logo{font-family:'Bricolage Grotesque',sans-serif}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-size:1.4rem;font-weight:800}
.cartbtn{background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px;display:grid;gap:28px}
@media(min-width:850px){.wrap{grid-template-columns:1.1fr 1fr;gap:48px;padding-top:36px;align-items:start}.gallery{position:sticky;top:84px}}
.main{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs button{flex:1;max-width:96px;aspect-ratio:1;padding:0;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--card)}
.thumbs button.on{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.tag{display:inline-block;background:#e3f4f1;color:var(--brand);font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;font-weight:800;margin:10px 0}
.price{font-size:2rem;font-weight:700;margin:6px 0}
.price small{font-size:.95rem;color:var(--mute);font-weight:400}
.lead{color:var(--mute);max-width:52ch}
.qtyrow{display:flex;align-items:center;gap:14px;margin:20px 0 12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qty button{width:42px;height:44px;background:none;color:var(--ink);font-size:1.3rem}
.qty span{min-width:30px;text-align:center;font-weight:700}
.btns{display:grid;gap:10px}
@media(min-width:500px){.btns{grid-template-columns:1fr 1fr}}
.add{background:var(--pop);color:#12232e;padding:15px;border-radius:12px;font-weight:700}
.buy{background:#25d366;color:#06361a;padding:15px;border-radius:12px;font-weight:700}
h2{font-size:1.3rem;margin:28px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--mute);width:42%}
td:last-child{font-weight:500}
.chat{position:fixed;right:16px;bottom:16px;z-index:7;background:#25d366;color:#06361a;border-radius:999px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 4px 14px #0003}
.chat svg{width:22px;height:22px;fill:currentColor}
footer{text-align:center;color:var(--mute);padding:24px 16px 90px;border-top:1px solid var(--line);font-size:.9rem}
#shade{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.open #drawer{transform:none}body.open #shade{display:block}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}
.x{background:none;color:var(--ink);font-size:1.8rem}
#items{flex:1;overflow:auto;padding:8px 16px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.row .t{flex:1}
.row .qty{display:inline-flex;margin-top:4px}
.row .qty button{width:32px;height:32px;font-size:1.1rem}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.df{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.df input,.df textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
.order{background:var(--brand);color:#fff;padding:14px;border-radius:12px;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" id="storeName"></div>
    <button class="cartbtn" id="openCart">Cart (<span id="count">0</span>)</button>
  </div>
</header>

<main class="wrap">
  <section class="gallery" aria-label="Product photos">
    <div class="main"><img id="mainImg" alt="South Indian jewellery set"></div>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section>
    <span class="tag">Jewellery set</span>
    <h1 id="pname"></h1>
    <div class="price" id="pprice"></div>
    <p class="lead" id="pdesc"></p>

    <div class="qtyrow">
      <span>Quantity</span>
      <div class="qty"><button id="qm" aria-label="Decrease quantity">&minus;</button><span id="q">1</span><button id="qp" aria-label="Increase quantity">+</button></div>
    </div>
    <div class="btns">
      <button class="add" id="addBtn">Add to cart</button>
      <button class="buy" id="buyBtn">Buy on WhatsApp</button>
    </div>

    <h2>Product details</h2>
    <table id="specs"></table>
  </section>
</main>

<footer id="foot"></footer>

<a class="chat" id="chat" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>Chat</a>

<div id="shade"></div>
<aside id="drawer" aria-label="Cart">
  <div class="dh"><h2>Your cart</h2><button class="x" id="closeCart" aria-label="Close cart">&times;</button></div>
  <div id="items"></div>
  <div class="df">
    <div class="tot"><span>Total</span><span id="total"></span></div>
    <input id="name" placeholder="Your name" autocomplete="name">
    <input id="phone" placeholder="Phone number" autocomplete="tel">
    <textarea id="addr" rows="2" placeholder="Full delivery address with pincode"></textarea>
    <button class="order" id="order">Send order on WhatsApp</button>
  </div>
</aside>

<script>
/* ============ EDIT YOUR STORE SETTINGS HERE ============ */
const CONFIG = {
  storeName: "LevelUpGears",
  currency: "₹",
  whatsapp: "918178794495",
  footer: "© 2026 LevelUpGears. All rights reserved."
};

/* ============ EDIT YOUR PRODUCT HERE ============ */
const PRODUCT = {
  id: "sij1",
  name: "South Indian Jewellery Set",
  price: 320,
  desc: "Traditional South Indian choker necklace with matching earrings. Gold plated matte finish with sparkling stones, ideal for weddings, festivals and special occasions. Best quality.",
  images: ["choker-set-3.jpg", "choker-set-1.jpg", "choker-set-2.jpg", "earrings-1.jpg"],
  specs: [
    ["Name", "South Indian Jewellery Set"],
    ["Base Metal", "Alloy"],
    ["Plating", "Gold Plated - Matte"],
    ["Stone Type", "Cubic Zirconia / American Diamond"],
    ["Sizing", "Adjustable"],
    ["Type", "As per image"],
    ["Net Quantity", "1 set (necklace + earrings)"],
    ["Quality", "Best quality"],
    ["Country of Origin", "India"]
  ]
};
/* ================================================ */

const $ = id => document.getElementById(id);
const money = n => CONFIG.currency + Math.round(n).toLocaleString("en-IN");
let qty = 1, cart = 0;
try { cart = +localStorage.getItem("cartQty") || 0; } catch(e) {}

document.title = PRODUCT.name + " | " + CONFIG.storeName;
$("storeName").textContent = CONFIG.storeName;
$("foot").textContent = CONFIG.footer;
$("pname").textContent = PRODUCT.name;
$("pprice").innerHTML = money(PRODUCT.price) + ' <small>inclusive of all taxes</small>';
$("pdesc").textContent = PRODUCT.desc;
$("specs").innerHTML = PRODUCT.specs.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");

function show(i){
  $("mainImg").src = PRODUCT.images[i];
  document.querySelectorAll(".thumbs button").forEach((b,k) => b.classList.toggle("on", k===i));
}
$("thumbs").innerHTML = PRODUCT.images.map((src,i) => `<button data-i="${i}" aria-label="Photo ${i+1}"><img src="${src}" alt=""></button>`).join("");
$("thumbs").addEventListener("click", e => { const b = e.target.closest("button"); if(b) show(+b.dataset.i); });
show(0);

$("qm").onclick = () => { qty = Math.max(1, qty-1); $("q").textContent = qty; };
$("qp").onclick = () => { qty = Math.min(20, qty+1); $("q").textContent = qty; };

function renderCart(){
  $("count").textContent = cart;
  $("total").textContent = money(cart * PRODUCT.price);
  $("items").innerHTML = cart ? `<div class="row"><img src="${PRODUCT.images[0]}" alt=""><div class="t"><b>${PRODUCT.name}</b>${money(PRODUCT.price)}
    <div><div class="qty"><button id="cm" aria-label="Decrease">&minus;</button><span>${cart}</span><button id="cp" aria-label="Increase">+</button></div></div></div>
    <b>${money(cart*PRODUCT.price)}</b></div>` : `<p class="empty">Your cart is empty. Add the set to start.</p>`;
  try { localStorage.setItem("cartQty", cart); } catch(e) {}
}
function openCart(){ document.body.classList.add("open"); }
function closeCart(){ document.body.classList.remove("open"); }

$("addBtn").onclick = () => { cart = Math.min(20, cart + qty); renderCart(); $("addBtn").textContent = "Added to cart"; setTimeout(()=>$("addBtn").textContent="Add to cart", 1000); };
$("buyBtn").onclick = () => { cart = qty; renderCart(); openCart(); };
$("openCart").onclick = openCart;
$("closeCart").onclick = $("shade").onclick = closeCart;
$("items").addEventListener("click", e => {
  if(e.target.id==="cp") cart = Math.min(20, cart+1);
  if(e.target.id==="cm") cart = Math.max(0, cart-1);
  renderCart();
});

$("order").onclick = () => {
  if(!cart){ alert("Your cart is empty."); return; }
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!name || !phone || !addr){ alert("Please fill in your name, phone and address."); return; }
  const msg = `New order from ${CONFIG.storeName}\n\n• ${cart} x ${PRODUCT.name} - ${money(cart*PRODUCT.price)}\n\nTotal: ${money(cart*PRODUCT.price)}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
};

$("chat").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hi, I have a question about the " + PRODUCT.name + ".")}`;
renderCart();
</script>
</body>
</html>

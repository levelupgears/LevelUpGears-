<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LevelUpGears</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fa;--card:#fff;--ink:#12232e;--mute:#5d6f7a;--line:#dbe4e8;--brand:#0f766e;--pop:#ffd23f}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',sans-serif}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-size:1.4rem;font-weight:800}
.hero{padding:40px 16px 24px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);font-weight:800;line-height:1.05;max-width:14ch}
.hero p{color:var(--mute);margin-top:12px;max-width:44ch}
.tools{max-width:1100px;margin:auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tools input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cats button{white-space:nowrap;padding:8px 16px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{max-width:1100px;margin:auto;padding:20px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:1;background:var(--line);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.hint{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:999px;font-size:.7rem;pointer-events:none}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:1rem;font-weight:600}
.info small{color:var(--mute)}
.price{font-weight:700;font-size:1.1rem;margin-top:auto;padding-top:8px}
.old{color:var(--mute);text-decoration:line-through;font-weight:400;font-size:.9rem;margin-left:6px}
.add{margin-top:8px;padding:10px;border-radius:10px;background:var(--pop);color:#12232e;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
#shade{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.open #drawer{transform:none}body.open #shade{display:block}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.x{background:none;color:var(--ink);font-size:1.6rem}
#items{flex:1;overflow:auto;padding:8px 16px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row .t{flex:1}.row b{display:block}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.df{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.df input,.df textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
.order{background:var(--brand);color:#fff;padding:14px;border-radius:12px;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;color:var(--mute);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;position:relative}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--pop);color:#12232e;font-weight:700;min-width:18px;height:18px;border-radius:9px;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
#count:empty,#count.z{display:none}
.chat{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;background:#25d366;color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 4px 14px #0003}
.chat svg{width:22px;height:22px;fill:#fff}
footer{text-align:center;color:var(--mute);padding:24px;border-top:1px solid var(--line);font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="logo" id="storeName"></div>
</header>

<section class="hero">
  <h1 id="tagline"></h1>
  <p id="sub"></p>
</section>

<div class="tools">
  <input id="search" type="search" placeholder="Search products">
  <div class="cats" id="cats"></div>
</div>

<main class="grid" id="grid"></main>

<footer id="foot"></footer>

<a class="chat" id="chat" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>Chat</a>

<nav class="tabs" aria-label="Main">
  <button id="tHome" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button id="tCats"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Categories</button>
  <button id="tSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</button>
  <button id="openCart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>Cart<span id="count" class="z">0</span></button>
</nav>

<div id="shade"></div>
<aside id="drawer" aria-label="Cart">
  <div class="dh"><h2>Your cart</h2><button class="x" id="closeCart" aria-label="Close cart">&times;</button></div>
  <div id="items"></div>
  <div class="df">
    <div class="tot"><span>Total</span><span id="total"></span></div>
    <input id="name" placeholder="Your name" autocomplete="name">
    <input id="phone" placeholder="Phone number" autocomplete="tel">
    <textarea id="addr" rows="2" placeholder="Delivery address"></textarea>
    <button class="order" id="order">Send order on WhatsApp</button>
  </div>
</aside>

<script>
/* ============ 1. EDIT YOUR STORE SETTINGS HERE ============ */
const CONFIG = {
  storeName: "LevelUpGears",
  tagline: "Traditional jewelry, delivered to your door.",
  subtitle: "Choose your set, add to cart, and send your order in one tap.",
  currency: "₹",
  whatsapp: "918178794495",   // 91 = India code + your number
  footer: "© 2026 LevelUpGears. All rights reserved."
};

/* ============ 2. ADD YOUR PRODUCTS HERE ============
   Copy one block, change the details. "image" can be a link to a
   photo (from your supplier) or leave "" to show the emoji. */
const PRODUCTS = [
  {id:1, name:"Kemp Choker Necklace Set", category:"Necklace Sets", price:799, oldPrice:1999,
   images:["choker-set-1.jpg","choker-set-2.jpg","choker-set-3.jpg"], emoji:"📿",
   desc:"Antique gold choker with earrings, ruby-green stones and pearl drops"},
  {id:2, name:"Pearl Drop Kemp Earrings", category:"Earrings", price:299, oldPrice:699,
   images:["earrings-1.jpg"], emoji:"✨",
   desc:"Gold finish jhumka-style earrings with pearl drops"}
];
/* ============================================================ */

const $ = id => document.getElementById(id);
const money = n => CONFIG.currency + Math.round(n).toLocaleString("en-IN");
let cart = {}, cat = "All";
try { cart = JSON.parse(localStorage.getItem("cart")) || {}; } catch(e) {}

document.title = CONFIG.storeName;
$("storeName").textContent = CONFIG.storeName;
$("tagline").textContent = CONFIG.tagline;
$("sub").textContent = CONFIG.subtitle;
$("foot").textContent = CONFIG.footer;

function saveCart(){ try{ localStorage.setItem("cart", JSON.stringify(cart)); }catch(e){} }

function renderCats(){
  const list = ["All", ...new Set(PRODUCTS.map(p => p.category))];
  $("cats").innerHTML = list.map(c => `<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join("");
}

function renderGrid(){
  const q = $("search").value.trim().toLowerCase();
  const list = PRODUCTS.filter(p => (cat==="All"||p.category===cat) && (p.name+p.desc).toLowerCase().includes(q));
  $("grid").innerHTML = list.length ? list.map(p => `
    <article class="p">
      <div class="img">${p.images && p.images.length ? `<img src="${p.images[0]}" alt="${p.name}" loading="lazy" data-cyc="${p.id}">` : p.emoji}${p.images && p.images.length>1 ? `<span class="hint">Tap photo for more</span>` : ""}</div>
      <div class="info">
        <h3>${p.name}</h3><small>${p.desc}</small>
        <div class="price">${money(p.price)}${p.oldPrice?`<span class="old">${money(p.oldPrice)}</span>`:""}</div>
        <button class="add" data-add="${p.id}">Add to cart</button>
      </div>
    </article>`).join("") : `<p class="empty">No products found. Try another search.</p>`;
}

function renderCart(){
  const ids = Object.keys(cart).filter(id => PRODUCTS.some(p => p.id==id));
  let total = 0, count = 0;
  $("items").innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(p => p.id==id), q = cart[id];
    total += p.price*q; count += q;
    return `<div class="row"><div class="t"><b>${p.name}</b>${money(p.price)}
      <div class="qty"><button data-dec="${id}" aria-label="Remove one">−</button>${q}<button data-inc="${id}" aria-label="Add one">+</button></div></div>
      <b>${money(p.price*q)}</b></div>`;
  }).join("") : `<p class="empty">Your cart is empty. Add a product to start.</p>`;
  $("total").textContent = money(total);
  $("count").textContent = count; $("count").className = count ? "" : "z";
  saveCart();
}

function change(id, d){
  cart[id] = (cart[id]||0) + d;
  if(cart[id] <= 0) delete cart[id];
  renderCart();
}

document.addEventListener("click", e => {
  const t = e.target;
  if(t.dataset.add){ change(t.dataset.add, 1); t.textContent = "Added"; setTimeout(()=>t.textContent="Add to cart", 900); }
  if(t.dataset.cyc){ const p = PRODUCTS.find(p => p.id==t.dataset.cyc); const i = ((+t.dataset.i||0)+1) % p.images.length; t.dataset.i = i; t.src = p.images[i]; }
  if(t.dataset.inc) change(t.dataset.inc, 1);
  if(t.dataset.dec) change(t.dataset.dec, -1);
  if(t.dataset.c){ cat = t.dataset.c; renderCats(); renderGrid(); }
});
$("search").addEventListener("input", renderGrid);
const mark = id => document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.id===id));
$("tHome").onclick = () => { cat="All"; $("search").value=""; renderCats(); renderGrid(); window.scrollTo({top:0,behavior:"smooth"}); mark("tHome"); };
$("tCats").onclick = () => { $("cats").scrollIntoView({behavior:"smooth",block:"center"}); mark("tCats"); };
$("tSearch").onclick = () => { window.scrollTo({top:0,behavior:"smooth"}); setTimeout(()=>$("search").focus(),250); mark("tSearch"); };
$("openCart").onclick = () => document.body.classList.add("open");
$("closeCart").onclick = $("shade").onclick = () => { document.body.classList.remove("open"); mark("tHome"); };

$("order").onclick = () => {
  const ids = Object.keys(cart);
  if(!ids.length){ alert("Your cart is empty."); return; }
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!name || !phone || !addr){ alert("Please fill in your name, phone and address."); return; }
  let total = 0;
  const lines = ids.map(id => {
    const p = PRODUCTS.find(p => p.id==id); total += p.price*cart[id];
    return `• ${cart[id]} x ${p.name} - ${money(p.price*cart[id])}`;
  });
  const msg = `New order from ${CONFIG.storeName}\n\n${lines.join("\n")}\n\nTotal: ${money(total)}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
};

$("chat").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hi LevelUpGears, I need help with a product.")}`;
renderCats(); renderGrid(); renderCart();
</script>
</body>
</html>
